# SymmetricDS JMeter Load Test Properties
#
# These values are defaults. Override them in the JMeter test plan's User Defined Variables
# or pass them via the JMeter command line: -Jproperty=value
#
# IMPORTANT: Before running, clear sym_incoming_batch on the server or set
# incoming.batches.record.ok.enabled=false. Otherwise batch ID reuse will cause the
# server to skip batches it thinks it has already processed.

# Number of concurrent threads (simulated sync nodes)
threads=6

# Thread ramp-up time in seconds
ramp_up_seconds=10

# Test duration in seconds
duration_seconds=120

# Delay in milliseconds between push/pull cycles per thread
time.between.sync.ms=1000

# List of channels to push (comma-separated).
# There must be a {channel}.csv template file in this directory for each channel.
channel.names=heartbeat

# Number of batches to create per channel during push
max.number.of.batches=1

# Max rows per batch for each channel (randomly chosen between 1 and this value)
max.number.of.rows.in.batch.heartbeat=1

# Starting batch ID. Must not overlap with existing batches in sym_incoming_batch.
batch.id.start=300000

# Flat list of node IDs to distribute across threads.
# Must have at least as many IDs as threads when node.id.unique.per.thread=true.
# Each node must be pre-registered in sym_node and sym_node_security.
node.ids=00001,00002,00003,00004,00005,00006

# When true, each thread is assigned a unique node ID from node.ids
node.id.unique.per.thread=true

# Server node ID (the node being pushed to / pulled from)
target.node.id=server

# Server sync URL and path
server.url=http://localhost:31415
server.path=/sync/server

# Node password from sym_node_security
server.auth.token=test
